name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build.py --check
      - run: python3 -m py_compile source/scripts/emit_system_message.py
